<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <!-- ปิดซูมด้วยนิ้ว: แตะปุ่มรัวๆ ในเกมจะได้ไม่ซูมหน้าจอ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1c1333" />
  <title>Hero Farm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>

  <div class="game-screen">

    <!-- ============ แถบสถานะด้านบน ============ -->
    <header class="hud">
      <div class="hud-row">
        <div class="hud-profile">
          <span class="level-badge">Lv.<span id="ui-level">1</span></span>
          <span class="hud-name" id="ui-name"></span>
        </div>
        <div class="hud-currencies">
          <div class="currency gold"><span>🪙</span><span id="ui-gold">0</span></div>
          <div class="currency gem"><span>💎</span><span id="ui-gem">0</span></div>
        </div>
      </div>

      <div class="bar hp-bar">
        <div class="bar-fill" id="ui-hp-fill"></div>
        <span class="bar-text">❤️ <span id="ui-hp-text">0 / 0</span></span>
      </div>
      <div class="bar exp-bar">
        <div class="bar-fill" id="ui-exp-fill"></div>
        <span class="bar-text">EXP <span id="ui-exp-text">0 / 0</span></span>
      </div>
    </header>

    <!-- ============ แผนที่ + ปุ่มควบคุมบนจอ ============ -->
    <main class="world-view">
      <canvas id="world-canvas"></canvas>

      <div class="joystick" id="joystick" aria-label="จอยสติ๊กเดิน">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
      <button class="attack-button" id="attack-btn" aria-label="โจมตี">⚔️</button>

      <div class="death-overlay" id="death-overlay" hidden>
        <p class="death-title">💀 หมดสติ</p>
        <p>ฟื้นที่จุดพักในอีก <span id="death-timer">3</span> วินาที</p>
      </div>

      <div class="toast-layer" id="toast-layer"></div>
    </main>

    <!-- ============ เมนูล่าง ============ -->
    <nav class="menu-bar">
      <button class="menu-button" data-panel="inventory">
        <span class="menu-icon">🎒</span>
        <span class="menu-label">กระเป๋า</span>
      </button>
      <button class="menu-button" data-panel="equipment">
        <span class="menu-icon">🛡️</span>
        <span class="menu-label">อุปกรณ์</span>
      </button>
      <button class="menu-button" data-panel="settings">
        <span class="menu-icon">⚙️</span>
        <span class="menu-label">ตั้งค่า</span>
      </button>
    </nav>

    <!-- ============ แผงเมนู (เลื่อนขึ้นทับแผนที่) ============ -->
    <div class="panel-overlay" id="panel-overlay" hidden>
      <section class="panel">
        <header class="panel-header">
          <h3 id="panel-title"></h3>
          <button class="panel-close" id="panel-close" aria-label="ปิด">✕</button>
        </header>
        <div class="panel-body" id="panel-body"></div>
      </section>
    </div>

    <!-- ============ หน้าสร้างตัวละคร ============ -->
    <div class="create-screen" id="create-screen" hidden>
      <form class="create-card" id="create-form">
        <h1 class="game-title">Hero Farm</h1>
        <p class="create-subtitle">สร้างตัวละครของคุณ</p>

        <label class="create-label" for="create-name">ชื่อตัวละคร</label>
        <input class="create-input" id="create-name" autocomplete="off" placeholder="เช่น น้องฮีโร่" />

        <p class="create-label">เลือกเพศ</p>
        <div class="gender-grid">
          <button type="button" class="gender-option selected" data-gender="male" aria-pressed="true">
            <span class="gender-icon">👦</span>ชาย
          </button>
          <button type="button" class="gender-option" data-gender="female" aria-pressed="false">
            <span class="gender-icon">👧</span>หญิง
          </button>
        </div>

        <p class="create-error" id="create-error"></p>
        <button type="submit" class="big-button">⚔️ เริ่มผจญภัย</button>
      </form>
    </div>

  </div>

  <!-- type="module" ทำให้ไฟล์ js แยกกันได้ ต้องเปิดผ่าน Live Server หรือ GitHub Pages -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
