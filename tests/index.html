<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Hero Farm — Tests</title>
  <style>
    body { font: 14px/1.6 monospace; padding: 16px; background: #1c1333; color: #fff8ea; }
    .PASS { color: #6fcf97; } .FAIL { color: #ff5c6c; } .INFO { color: #a7e9ff; }
    iframe { width: 420px; height: 760px; border: 0; margin-top: 12px; }
  </style>
</head>
<body>
  <!--
    หน้าทดสอบอัตโนมัติ — เปิดผ่าน Live Server: /tests/
    ไม่ต้องติดตั้งอะไรเพิ่ม เซฟจริงของผู้เล่นถูกสำรองไว้ก่อนทดสอบและคืนให้หลังจบ
  -->
  <h1>Hero Farm tests</h1>
  <pre id="out">RUNNING…</pre>

  <script type="module">
    import { state, replaceState, createNewState, addPlayerExp } from "../js/state.js";
    import { loadGame } from "../js/save.js";
    import { createCharacter, validateName } from "../js/systems/player.js";
    import { getPlayerStats, calcDamage } from "../js/systems/stats.js";
    import { addMaterial, addEquipment, equip, sellEquipment, sellMaterial, countMaterial, isEquipped } from "../js/systems/inventory.js";
    import { useItem, pickHealingPotion } from "../js/systems/consumables.js";
    import { upgradeEquipment, getUpgradeCost, MAX_PLUS } from "../js/systems/upgrade.js";
    import { rollLoot } from "../js/systems/loot.js";
    import { createRng } from "../js/systems/rng.js";
    import { createWorld, updateWorld, isInSafeZone, WORLD_RULES } from "../js/game/world.js";
    import { MONSTERS } from "../data/monsters.js";
    import { MAPS, START_MAP_ID } from "../data/maps.js";
    import {
      ITEMS, RARITIES, ITEM_TYPES, getItemById, getItemsByType, getItemsByRarity,
      resolveItemId, isStackable, getCollectionProgress, validateItemDefinitions
    } from "../js/systems/itemDatabase.js";

    const lines = [];
    const log = (status, text) => lines.push(`${status} ${text}`);
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    async function test(name, fn) {
      try {
        await fn();
        log("PASS", name);
      } catch (error) {
        log("FAIL", `${name} — ${error.message}`);
      }
    }

    function freshCharacter(gender = "male") {
      replaceState(createNewState());
      createCharacter("Tester", gender);
    }

    // สำรองเซฟจริง (หน้านี้อยู่ origin เดียวกับเกม)
    const SAVE_KEYS = ["herofarm_save", "herofarm_save_backup"];
    const realSaves = Object.fromEntries(SAVE_KEYS.map((key) => [key, localStorage.getItem(key)]));

    // =====================================================
    // ระบบย่อย
    // =====================================================
    await test("ตัวละครใหม่ได้อุปกรณ์เริ่มต้นและสวมไว้", () => {
      freshCharacter();
      const stats = getPlayerStats();
      assert(state.inventory.equipment.length === 2, "equipment " + state.inventory.equipment.length);
      assert(stats.atk === 14 && stats.def === 4 && stats.maxHp === 110, JSON.stringify(stats));
    });

    await test("ตรวจชื่อตัวละคร", () => {
      assert(validateName(" a ") !== null, "สั้นเกิน");
      assert(validateName("ชื่อยาวมากเกินสิบสองตัว") !== null, "ยาวเกิน");
      assert(validateName("ฮีโร่") === null, "ชื่อปกติ");
    });

    await test("เลเวลอัพแล้วค่าพลังเพิ่ม", () => {
      freshCharacter();
      assert(addPlayerExp(100) === 1, "ควรขึ้น 1 เลเวล");
      assert(getPlayerStats().atk === 16, "atk " + getPlayerStats().atk);
    });

    await test("ดาเมจต่ำสุด 1 และคริคูณ", () => {
      assert(calcDamage(1, 999, () => 0.5).amount === 1, "min 1");
      const crit = calcDamage(100, 0, () => 0, 1, 1.5);
      assert(crit.crit && crit.amount === 135, "crit " + crit.amount);
    });

    await test("ตีบวก: สำเร็จ / ไม่สำเร็จ / ของไม่พอ / สูงสุด", () => {
      freshCharacter();
      const sword = state.inventory.equipment[0];
      addMaterial("enhance_stone", 50);
      state.player.gold = 1_000_000;

      const gold = state.player.gold;
      let result = upgradeEquipment(sword.uid, () => 0);
      assert(result.success && sword.plus === 1 && state.player.gold === gold - 40, "+1");
      assert(getPlayerStats().atk === 15, "atk +1");

      sword.plus = 2;
      result = upgradeEquipment(sword.uid, () => 0.99);
      assert(result.ok && !result.success && sword.plus === 2, "fail keeps plus");

      state.inventory.materials = {};
      assert(upgradeEquipment(sword.uid).reason === "stones", "stones");

      sword.plus = MAX_PLUS;
      assert(upgradeEquipment(sword.uid).reason === "maxed", "maxed");
      assert(getUpgradeCost({ itemId: "golem_hammer", plus: 0 }).gold === 120, "rarity cost");
    });

    await test("ขายของ: ของที่สวมอยู่ขายไม่ได้", () => {
      freshCharacter();
      const equipped = state.inventory.equipment[0];
      assert(sellEquipment(equipped.uid) === 0 && isEquipped(equipped.uid), "equipped");

      const spare = addEquipment("iron_sword", 2);
      assert(sellEquipment(spare.uid) === 80, "sell price with plus");
      assert(!state.inventory.equipment.includes(spare), "removed");
    });

    await test("สุ่มของดรอป", () => {
      const all = rollLoot(MONSTERS.slime, () => 0);
      assert(all.items.length === MONSTERS.slime.drops.length && all.gold === 3, "all drops");
      const none = rollLoot(MONSTERS.slime, () => 0.999);
      assert(none.items.length === 0 && none.gold === 6, "no drops");
    });

    // =====================================================
    // ITEM DATABASE
    // =====================================================
    await test("Item DB: ไอเทมตัวอย่างครบ และทุกชิ้นมีฟิลด์พื้นฐาน", () => {
      const examples = [
        "wooden_sword", "iron_sword", "flame_sword", "leather_armor", "iron_armor", "knight_armor",
        "small_hp_potion", "large_hp_potion", "exp_potion",
        "slime_gel", "wolf_fang", "iron_ore", "magic_crystal", "slime_badge", "ancient_coin"
      ];
      for (const id of examples) assert(getItemById(id), "ไม่มี " + id);

      const fields = ["id", "name", "type", "rarity", "icon", "description", "maxStack", "sellPrice",
        "buyPrice", "levelRequirement", "isSellable", "isTradable", "isEquippable"];
      for (const item of Object.values(ITEMS)) {
        for (const field of fields) assert(item[field] !== undefined, `${item.id} ไม่มี ${field}`);
        assert(ITEM_TYPES[item.type] && RARITIES[item.rarity], item.id + " type/rarity");
        assert(Object.isFrozen(item), item.id + " ต้องแก้ค่าไม่ได้");
      }
    });

    await test("Item DB: ค้นหาด้วย id / type / rarity", () => {
      assert(getItemById("iron_sword").name === "ดาบเหล็ก", "by id");
      assert(getItemById("nope") === null && getItemById("constructor") === null && getItemById(undefined) === null, "unknown id");

      const weapons = getItemsByType("weapon");
      assert(weapons.length >= 3 && weapons.every((item) => item.type === "weapon" && item.isEquippable && item.slot === "weapon"), "weapons");
      assert(getItemsByType("material").every((item) => !item.isEquippable && item.material), "materials");
      assert(getItemsByRarity("epic").some((item) => item.id === "flame_sword"), "epic");
      assert(getItemsByType("quest").length === 0 && getItemsByRarity("mythic").length === 0, "empty lists");

      const flame = getItemById("flame_sword");
      assert(flame.stats.attack === 22 && flame.stats.critical === 0.05 && flame.stats.hp === 0, "weapon stats + defaults");
      assert(getItemById("small_hp_potion").effects[0].type === "hp" && getItemById("slime_gel").stats === null, "effects / stats null");
      assert(getItemById("slime_badge").collectible.kind === "badge" && !getItemById("slime_badge").isSellable, "collectible");
      assert(isStackable("slime_gel") && !isStackable("iron_sword"), "stackable");
    });

    await test("Item DB: ID เก่าที่เปลี่ยนชื่อยังหาเจอ และเซฟเก่าถูกแปลง", () => {
      assert(resolveItemId("wood_sword") === "wooden_sword" && getItemById("slime_jelly").id === "slime_gel", "legacy lookup");
      localStorage.setItem("herofarm_save", JSON.stringify({
        version: 3,
        profile: { name: "Old", gender: "male" },
        player: { level: 2, exp: 0, gold: 10, gem: 0 },
        inventory: { materials: { slime_jelly: 4, slime_gel: 1 }, equipment: [{ uid: 5, itemId: "wood_sword", plus: 2 }] },
        equipped: { weapon: 5, armor: null },
        nextUid: 6
      }));
      assert(loadGame(), "load");
      assert(state.inventory.materials.slime_gel === 5 && !("slime_jelly" in state.inventory.materials), JSON.stringify(state.inventory.materials));
      assert(state.inventory.equipment[0].itemId === "wooden_sword" && state.equipped.weapon === 5, JSON.stringify(state.inventory.equipment));
      assert(getPlayerStats().atk === 18, "atk " + getPlayerStats().atk);
    });

    await test("Item DB: ตรวจจับข้อมูลผิด", () => {
      const good = { id: "test_item", name: "ทดสอบ", type: "material", rarity: "common" };
      assert(validateItemDefinitions([good], {}).length === 0, "good item");

      const badCases = [
        [{ ...good, id: "ดาบ" }, "id"],
        [{ ...good, rarity: "ตำนาน" }, "rarity"],
        [{ ...good, type: "food" }, "type"],
        [{ ...good, type: "weapon", stats: { atk: 5 } }, "stats.atk"],
        [{ ...good, type: "consumable" }, "effects"],
        [{ ...good, sellPrice: -1 }, "sellPrice"]
      ];
      for (const [def, keyword] of badCases) {
        const errors = validateItemDefinitions([def], {});
        assert(errors.some((error) => error.includes(keyword)), `ต้องจับ ${keyword} ได้: ${JSON.stringify(errors)}`);
      }
      assert(validateItemDefinitions([good, good], {}).some((error) => error.includes("ซ้ำ")), "duplicate id");
      assert(validateItemDefinitions([good], { old_id: "missing" }).length === 1, "legacy target missing");
    });

    await test("Item DB: เตรียมสมุดสะสม (ค้นพบ / ทั้งหมด ต่อประเภท)", () => {
      const progress = getCollectionProgress(["slime_jelly", "slime_gel", "wolf_fang", "iron_sword", "nope"]);
      const byType = Object.fromEntries(progress.map((row) => [row.type, row]));
      assert(progress.length === Object.keys(ITEM_TYPES).length, "ทุกประเภท");
      assert(byType.material.found === 2 && byType.material.total === getItemsByType("material").length, JSON.stringify(byType.material));
      assert(byType.weapon.found === 1 && byType.collectible.found === 0, "weapon / collectible");
    });

    // =====================================================
    // ใช้ไอเทม (consumable)
    // =====================================================
    await test("ใช้ยา: ฟื้น HP + หักของ / ใช้ไม่ได้เมื่อเลือดเต็ม-ไม่มีของ-เลเวลไม่ถึง-หมดสติ", () => {
      freshCharacter();
      const world = createWorld(START_MAP_ID, createRng(1));
      const maxHp = getPlayerStats().maxHp;

      assert(useItem("small_hp_potion", world).reason === "notOwned", "notOwned");
      addMaterial("small_hp_potion", 2);
      assert(useItem("small_hp_potion", world).reason === "fullHp" && countMaterial("small_hp_potion") === 2, "เลือดเต็มต้องไม่เสียยา");

      world.player.hp = maxHp - 30;
      const result = useItem("small_hp_potion", world);
      assert(result.ok && result.healed === 30 && world.player.hp === maxHp && countMaterial("small_hp_potion") === 1, JSON.stringify(result));

      addMaterial("large_hp_potion", 1);
      world.player.hp = 10;
      assert(useItem("large_hp_potion", world).reason === "level", "levelRequirement");
      assert(useItem("iron_sword", world).reason === "notConsumable" && useItem("slime_gel", world).reason === "notConsumable", "notConsumable");
      world.player.dead = true;
      assert(useItem("small_hp_potion", world).reason === "dead" && countMaterial("small_hp_potion") === 1, "dead");
    });

    await test("ใช้ยา EXP: ได้ EXP, เลเวลอัพแล้วเลือดเต็ม", () => {
      freshCharacter();
      const world = createWorld(START_MAP_ID, createRng(1));
      world.player.hp = 5;
      addMaterial("exp_potion", 1);
      const result = useItem("exp_potion", world);
      assert(result.ok && result.exp === 200 && result.levelsGained === 1 && state.player.level === 2, JSON.stringify(result));
      assert(world.player.hp === getPlayerStats().maxHp && countMaterial("exp_potion") === 0, "hp เต็ม / ยาหมด");
    });

    await test("ปุ่มลัด Q เลือกยาที่พอดีที่สุด", () => {
      freshCharacter();
      assert(pickHealingPotion(40) === null, "ไม่มียา");
      state.player.level = 5;
      addMaterial("small_hp_potion", 1);
      addMaterial("large_hp_potion", 1);
      assert(pickHealingPotion(40).id === "small_hp_potion", "ขาดน้อย → ยาเล็ก");
      assert(pickHealingPotion(200).id === "large_hp_potion", "ขาดมาก → ยาใหญ่");
      assert(pickHealingPotion(999).id === "large_hp_potion", "ขาดเกินทุกขวด → ขวดที่ฟื้นมากสุด");
      state.player.level = 1;
      assert(pickHealingPotion(200).id === "small_hp_potion", "เลเวลไม่ถึงยาใหญ่ → ใช้ยาเล็ก");
    });

    await test("ของที่ isSellable: false ขายไม่ได้", () => {
      freshCharacter();
      addMaterial("slime_badge", 1);
      assert(sellMaterial("slime_badge") === 0 && countMaterial("slime_badge") === 1, "slime_badge");
      addMaterial("small_hp_potion", 3);
      assert(sellMaterial("small_hp_potion", 3) === 9 && countMaterial("small_hp_potion") === 0, "ยาขายได้");
    });

    // =====================================================
    // แปลงเซฟเก่า
    // =====================================================
    await test("แปลงเซฟ v2 (เกมการ์ด) → v3", () => {
      localStorage.setItem("herofarm_save", JSON.stringify({
        version: 2,
        player: { level: 4, exp: 20, gold: 777, gem: 9, energy: 10, maxEnergy: 75, energyUpdatedAt: 1 },
        characters: [{ id: "knight_moon", level: 6, exp: 0 }],
        lastSavedAt: 1
      }));
      assert(loadGame(), "load");
      assert(state.version === 3 && state.profile === null && state.mapId === START_MAP_ID, "version/profile/map");
      assert(state.player.level === 4 && state.player.gold === 777 && !("energy" in state.player), JSON.stringify(state.player));
      assert(!("characters" in state), "characters removed");
      assert(JSON.parse(localStorage.getItem("herofarm_save_backup")).version === 2, "backup");
    });

    await test("แปลงเซฟ v1 → v3 ต่อกันได้", () => {
      localStorage.setItem("herofarm_save", JSON.stringify({
        version: 1,
        player: { level: 2, exp: 5, gold: 50, gem: 1 },
        characters: [{ id: "knight_moon", name: "x", level: 5, exp: 0, maxHp: 1, atk: 1 }]
      }));
      assert(loadGame() && state.version === 3 && state.player.gold === 50, "v1");
    });

    await test("เซฟ v3 ที่เสียบางส่วนถูกซ่อม", () => {
      localStorage.setItem("herofarm_save", JSON.stringify({
        version: 3,
        profile: { name: "  Hero  ", gender: "female" },
        player: { level: "oops", exp: 1, gold: -5, gem: 2 },
        inventory: {
          materials: { enhance_stone: 3, deleted_item: 9, slime_jelly: -2 },
          equipment: [
            { uid: 1, itemId: "iron_sword", plus: 99 },
            { uid: 1, itemId: "wood_sword", plus: 0 },
            { uid: 7, itemId: "deleted_sword", plus: 0 }
          ]
        },
        equipped: { weapon: 1, armor: 1 },
        nextUid: 2,
        mapId: "constructor"
      }));
      assert(loadGame(), "load");
      assert(state.profile.name === "Hero", "trim name");
      assert(state.player.level === 1 && state.player.gold === 0, JSON.stringify(state.player));
      assert(JSON.stringify(state.inventory.materials) === '{"enhance_stone":3}', JSON.stringify(state.inventory.materials));
      assert(state.inventory.equipment.length === 1 && state.inventory.equipment[0].plus === MAX_PLUS, "equipment");
      assert(state.equipped.weapon === 1 && state.equipped.armor === null, JSON.stringify(state.equipped));
      assert(state.mapId === START_MAP_ID, "mapId " + state.mapId);
    });

    // =====================================================
    // โลกในเกม (จำลองการเล่นโดยไม่ต้องวาดจอ)
    // =====================================================
    await test("แผนที่สุ่มสิ่งกีดขวางได้ตำแหน่งเดิมทุกครั้ง", () => {
      freshCharacter();
      const a = createWorld(START_MAP_ID, createRng(1));
      const b = createWorld(START_MAP_ID, createRng(2));
      assert(a.obstacles.length > 40 && JSON.stringify(a.obstacles) === JSON.stringify(b.obstacles), "obstacles");
    });

    await test("ข้อมูลแผนที่: มอนเตอร์/ไอเทมมีจริง และประตูไป-กลับครบ", () => {
      for (const map of Object.values(MAPS)) {
        for (const zone of map.zones) assert(MONSTERS[zone.monsterId], `${map.id}: ไม่มีมอนเตอร์ ${zone.monsterId}`);
        for (const portal of map.portals) {
          assert(MAPS[portal.to], `${map.id}: ประตูไปแผนที่ ${portal.to} ที่ไม่มีอยู่`);
          assert(MAPS[portal.to].portals.some((back) => back.to === map.id), `${portal.to}: ไม่มีประตูกลับ ${map.id}`);
        }
      }
      for (const [id, monster] of Object.entries(MONSTERS)) {
        assert(Object.values(MAPS).some((map) => map.zones.some((zone) => zone.monsterId === id)), `มอนเตอร์ ${id} ไม่อยู่แผนที่ไหนเลย`);
        for (const drop of monster.drops) assert(ITEMS[drop.itemId], `${id}: ไม่มีไอเทม ${drop.itemId}`);
      }
    });

    await test("เดินเข้าประตู → ย้ายแผนที่ แล้วเกิดข้างประตูฝั่งที่มา", () => {
      freshCharacter();
      const world = createWorld(START_MAP_ID, createRng(1));
      const portal = world.map.portals[0];
      world.player.x = portal.x;
      world.player.y = portal.y;
      const idle = { moveX: 0, moveY: 0, attack: false };

      const travel = updateWorld(world, idle, 1 / 30).find((event) => event.type === "travel");
      assert(travel && travel.to === portal.to && travel.from === START_MAP_ID, "travel " + JSON.stringify(travel));
      assert(!updateWorld(world, idle, 1 / 30).some((event) => event.type === "travel"), "ส่ง travel ซ้ำ");

      const next = createWorld(portal.to, createRng(1), START_MAP_ID);
      const back = next.map.portals.find((p) => p.to === START_MAP_ID);
      const gap = Math.hypot(next.player.x - back.x, next.player.y - back.y);
      assert(gap > WORLD_RULES.portalRadius && gap < 150, "ระยะจากประตู " + gap);
    });

    // บอทง่ายๆ: เดินเข้าหามอนเตอร์ชนิดที่กำหนดแล้วตี
    // rest = true → เลือดต่ำกว่า 35% ถอยกลับไปพักที่จุดพักจนเหลือ 90% (เล่นแบบคนทั่วไป)
    function runBot(world, monsterId, seconds, { rest = false } = {}) {
      const stats = { kills: 0, pickups: 0, deaths: 0, maxSafeViolation: 0 };
      const dt = 1 / 30;
      let resting = false;

      for (let t = 0; t < seconds; t += dt) {
        const player = world.player;
        const targets = world.monsters.filter((m) => !m.dead && m.defId === monsterId);
        const target = targets.sort((m1, m2) => Math.hypot(m1.x - player.x, m1.y - player.y) - Math.hypot(m2.x - player.x, m2.y - player.y))[0];

        const maxHp = getPlayerStats().maxHp;
        if (rest && player.hp < maxHp * 0.35) resting = true;
        if (resting && player.hp >= maxHp * 0.9) resting = false;

        const input = { moveX: 0, moveY: 0, attack: false };
        if (resting) {
          const dx = world.map.spawn.x - player.x;
          const dy = world.map.spawn.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 20) {
            input.moveX = dx / dist;
            input.moveY = dy / dist;
          }
        } else if (target) {
          const dx = target.x - player.x;
          const dy = target.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 40) {
            input.moveX = dx / dist;
            input.moveY = dy / dist;
          }
          input.attack = dist < 90;
        }

        for (const event of updateWorld(world, input, dt)) {
          if (event.type === "kill") stats.kills++;
          if (event.type === "pickup") stats.pickups++;
          if (event.type === "playerDied") stats.deaths++;
        }

        for (const m of world.monsters) {
          if (!m.dead && isInSafeZone(world, m.x, m.y)) stats.maxSafeViolation++;
          if (!Number.isFinite(m.x) || !Number.isFinite(m.y)) throw new Error("monster NaN");
        }
        if (!Number.isFinite(player.x)) throw new Error("player NaN");
      }
      return stats;
    }

    await test("จำลองเล่น 3 นาที: ตีสไลม์ได้ของและเลเวลขึ้น (ถอยไปพักเมื่อเลือดน้อย)", () => {
      for (const seed of [7, 8, 9]) {
        freshCharacter();
        const world = createWorld(START_MAP_ID, createRng(seed));
        const gold = state.player.gold;
        const result = runBot(world, "slime", 180, { rest: true });

        log("INFO", `  สไลม์ 3 นาที seed ${seed}: ฆ่า ${result.kills} ตัว, เก็บของ ${result.pickups} ครั้ง, ตาย ${result.deaths}, Lv.${state.player.level}, ทอง +${state.player.gold - gold}, ไอเทม ${JSON.stringify(state.inventory.materials)}`);
        assert(result.kills >= 10, `seed ${seed} kills ${result.kills}`);
        assert(result.pickups >= result.kills, `seed ${seed} pickups ${result.pickups}`);
        assert(result.deaths === 0, `seed ${seed}: Lv.1 ที่รู้จักพักไม่ควรตายให้สไลม์`);
        assert(state.player.level >= 2 && state.player.gold > gold, `seed ${seed} progress`);
        assert(result.maxSafeViolation === 0, `seed ${seed} monster entered safe zone`);
      }

      // ข้อมูลประกอบ: บอทที่ตีไม่หยุดเลย (ไม่นับเป็นผ่าน/ไม่ผ่าน)
      freshCharacter();
      const reckless = runBot(createWorld(START_MAP_ID, createRng(7)), "slime", 180);
      log("INFO", `  สไลม์ 3 นาที ตีไม่พักเลย: ฆ่า ${reckless.kills} ตาย ${reckless.deaths}`);
    });

    await test("สมดุล: Lv.1 สู้แมงป่องไม่ไหว / Lv.10 + ของดีสู้ได้", () => {
      freshCharacter();
      let world = createWorld("desert", createRng(3));
      const weak = runBot(world, "scorpion", 60);

      freshCharacter();
      state.player.level = 10;
      equip(addEquipment("iron_sword", 5).uid);
      equip(addEquipment("leather_armor", 5).uid);
      world = createWorld("desert", createRng(3));
      const strong = runBot(world, "scorpion", 60);

      log("INFO", `  แมงป่อง 1 นาที: Lv.1 ของเริ่มต้น ฆ่า ${weak.kills} ตาย ${weak.deaths} | Lv.10 ดาบ+5 เกราะ+5 ฆ่า ${strong.kills} ตาย ${strong.deaths}`);
      assert(weak.deaths >= 1, "Lv.1 ควรแพ้แมงป่อง");
      assert(strong.kills >= 2, "Lv.10 ควรชนะแมงป่อง");
    });

    await test("บอส: Lv.1 สู้ไม่ไหว / Lv.15 + ของดีล้มผู้พิทักษ์ป่าได้", () => {
      freshCharacter();
      let world = createWorld("guardian_grove", createRng(5));
      const weak = runBot(world, "forest_guardian", 60);

      freshCharacter();
      state.player.level = 15;
      equip(addEquipment("desert_blade", 5).uid);
      equip(addEquipment("sand_armor", 5).uid);
      world = createWorld("guardian_grove", createRng(5));
      const strong = runBot(world, "forest_guardian", 90);

      log("INFO", `  บอส 1.5 นาที: Lv.1 ฆ่า ${weak.kills} ตาย ${weak.deaths} | Lv.15 ตรีศูล+5 เกราะทราย+5 ฆ่า ${strong.kills} ตาย ${strong.deaths}`);
      assert(weak.deaths >= 1 && weak.kills === 0, "Lv.1 ควรแพ้บอส");
      assert(strong.kills >= 1, "Lv.15 ของดีควรล้มบอสได้");
    });

    await test("สมดุลรายมอนเตอร์ (เลเวลแนะนำ + ของเริ่มต้น)", () => {
      const summary = [];
      for (const map of Object.values(MAPS)) {
        for (const monsterId of new Set(map.zones.map((zone) => zone.monsterId))) {
          const monster = MONSTERS[monsterId];
          freshCharacter();
          state.player.level = monster.level;
          const result = runBot(createWorld(map.id, createRng(11)), monsterId, 60);
          summary.push(`${monster.icon}Lv.${monster.level} ฆ่า ${result.kills} ตาย ${result.deaths}`);
        }
      }
      log("INFO", "  1 นาทีที่เลเวลแนะนำ: " + summary.join(" | "));
    });

    // =====================================================
    // เล่นจริงผ่านหน้าเกม (iframe)
    // =====================================================
    async function waitFor(check, timeout = 4000) {
      const start = performance.now();
      while (performance.now() - start < timeout) {
        const value = check();
        if (value) return value;
        await sleep(50);
      }
      throw new Error("timeout waiting");
    }

    async function openGame(frame) {
      frame.src = "../index.html?t=" + Math.random();
      await new Promise((resolve) => (frame.onload = resolve));
      return waitFor(() => frame.contentWindow.heroFarm && frame.contentDocument);
    }

    await test("หน้าเกม: เซฟเก่า → สร้างตัวละคร → เดิน → ตีบวก → เซฟคงอยู่", async () => {
      localStorage.setItem("herofarm_save", JSON.stringify({
        version: 2, player: { level: 3, exp: 0, gold: 5000, gem: 9 }, characters: []
      }));

      const frame = document.createElement("iframe");
      document.body.append(frame);
      let doc = await openGame(frame);
      let game = frame.contentWindow.heroFarm;

      assert(!doc.getElementById("create-screen").hidden, "ต้องเปิดหน้าสร้างตัวละคร");
      doc.getElementById("create-name").value = "ก";
      doc.getElementById("create-form").requestSubmit();
      assert(doc.getElementById("create-error").textContent !== "", "ชื่อสั้นต้องขึ้น error");

      doc.querySelector('[data-gender="female"]').click();
      doc.getElementById("create-name").value = "มินนี่";
      doc.getElementById("create-form").requestSubmit();
      await waitFor(() => game.world);
      assert(doc.getElementById("create-screen").hidden, "หน้าสร้างต้องปิด");
      assert(game.state.profile.gender === "female" && game.state.player.level === 3, "profile/level");
      await waitFor(() => doc.getElementById("ui-gold").textContent === "5,000");
      assert(doc.getElementById("ui-name").textContent === "มินนี่", "HUD name");

      // เดินขวาด้วยคีย์บอร์ด
      const startX = game.world.player.x;
      frame.contentWindow.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyD" }));
      await sleep(600);
      frame.contentWindow.dispatchEvent(new KeyboardEvent("keyup", { code: "KeyD" }));
      assert(game.world.player.x > startX + 30, `player moved ${startX} → ${game.world.player.x}`);

      // เปิดแผงอุปกรณ์ = หยุดเวลา
      doc.querySelector('[data-panel="equipment"]').click();
      const pausedAt = game.world.time;
      await sleep(300);
      assert(game.world.time === pausedAt, "เปิดเมนูแล้วเวลาต้องหยุด");

      game.state.inventory.materials.enhance_stone = 5;
      game.renderPanel();
      doc.querySelector('[data-action="upgrade"]').click();
      const weapon = game.state.inventory.equipment.find((item) => item.uid === game.state.equipped.weapon);
      assert(weapon.plus === 1 && game.state.player.gold === 4960, "upgrade +1");

      doc.getElementById("panel-close").click();
      await sleep(200);
      assert(game.world.time > pausedAt, "ปิดเมนูแล้วเวลาเดินต่อ");

      // ปิดหน้าเกม (pagehide เซฟ) แล้วเปิดใหม่
      frame.remove();
      await sleep(100);
      const frame2 = document.createElement("iframe");
      document.body.append(frame2);
      doc = await openGame(frame2);
      game = frame2.contentWindow.heroFarm;
      await waitFor(() => game.world);

      assert(doc.getElementById("create-screen").hidden, "ผู้เล่นเดิมไม่ต้องสร้างตัวละครซ้ำ");
      const saved = game.state.inventory.equipment.find((item) => item.uid === game.state.equipped.weapon);
      assert(saved.plus === 1 && game.state.player.gold === 4960, "เซฟตีบวกคงอยู่");

      // ไม่มีปุ่มโจมตีบนจอ — คลิกซ้ายบนแผนที่ = ตี, คลิกขวาไม่ตี
      assert(!doc.getElementById("attack-btn"), "ต้องไม่มีปุ่มโจมตีบนจอ");
      const canvas = doc.getElementById("world-canvas");
      const slime = game.world.monsters.find((monster) => !monster.dead && monster.defId === "slime");
      game.world.player.x = slime.x - (game.world.player.radius + slime.radius + 5);
      game.world.player.y = slime.y;
      const click = (button) => {
        const pointer = { bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, pointerType: "mouse", button };
        canvas.dispatchEvent(new frame2.contentWindow.PointerEvent("pointerdown", pointer));
        return sleep(150).then(() => canvas.dispatchEvent(new frame2.contentWindow.PointerEvent("pointerup", pointer)));
      };

      let slimeHp = slime.hp;
      await click(2);
      assert(slime.hp === slimeHp, `คลิกขวาต้องไม่ตี ${slimeHp} → ${slime.hp}`);
      await sleep(500);
      slimeHp = slime.hp;
      await click(0);
      assert(slime.hp < slimeHp, `คลิกซ้ายบนแผนที่ต้องตีโดน ${slimeHp} → ${slime.hp}`);

      // ใช้ยา: ปุ่มลัด Q
      game.state.inventory.materials.small_hp_potion = 2;
      game.world.player.hp = 20;
      frame2.contentWindow.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyQ" }));
      assert(game.state.inventory.materials.small_hp_potion === 1 && game.world.player.hp === 70, `Q ใช้ยา hp=${game.world.player.hp}`);

      // ใช้ยา: ปุ่ม "ใช้" ในกระเป๋า
      game.world.player.hp = 20;
      doc.querySelector('[data-panel="inventory"]').click();
      const useButton = doc.querySelector('[data-action="use-item"][data-item-id="small_hp_potion"]');
      assert(useButton, "ต้องมีปุ่มใช้ยาในกระเป๋า");
      useButton.click();
      assert(!("small_hp_potion" in game.state.inventory.materials) && game.world.player.hp === 70, `ปุ่มใช้ในกระเป๋า hp=${game.world.player.hp}`);
      doc.getElementById("panel-close").click();
      frame2.remove();
    });

    // คืนเซฟจริง
    for (const [key, value] of Object.entries(realSaves)) {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    }

    const failed = lines.filter((line) => line.startsWith("FAIL")).length;
    const passed = lines.filter((line) => line.startsWith("PASS")).length;
    document.getElementById("out").innerHTML =
      lines.map((line) => `<span class="${line.slice(0, 4)}">${line.replace(/</g, "&lt;")}</span>`).join("\n") +
      `\n\n${passed} passed, ${failed} failed\nDONE`;
    document.title = failed ? "FAILED" : "PASSED";
  </script>
</body>
