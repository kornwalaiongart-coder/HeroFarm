<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820">
  <!--
    HeroFarm — Female Mage (designed with ChatGPT, repaired for the game)
    Layer order back → front: accessory(back), hair(back), base, costume, boots,
    armor, weapon, gloves, accessory(front), hair(front), head(empty)
  -->
  <defs>
    <style>
      .hf-mage-outline { stroke: #3a2826; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <symbol id="hf-mage-emblem" viewBox="0 0 40 46">
      <path class="hf-mage-outline" fill="#d8b35a" d="M4 5 L36 5 L36 27 Q36 38 20 43 Q4 38 4 27 Z"/>
