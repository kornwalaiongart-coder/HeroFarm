<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820">
  <!--
    HeroFarm — Female Hero (original design)
    Mirrored pose of the male hero so the pair reads well side by side.
    Layer order back → front. Each replaceable slot is a <g data-slot="...">:
      accessory (back)  → cape
      hair (back)       → ponytail
      base              → skin / face (not replaceable)
      costume           → shirt + trousers
      boots
      armor             → light leather corset armor, shoulder pad, belt, pouches, hip guards
      weapon            → short sword
      gloves
      accessory (front) → cape over shoulder + HeroFarm emblem clasp
      hair (front)      → bangs, side locks, hair tie
      head              → head equipment (empty — for future helmets / hats)
  -->
  <defs>
    <style>
      .ln { stroke: #3a2826; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #3a2826; stroke-width: 2; stroke-linecap: round; fill: none; }
      .no { stroke: none; }
    </style>
    <!-- HeroFarm emblem: golden shield with a two-leaf sprout -->
    <symbol id="hf-emblem-f" viewBox="-12 -12 24 24">
      <path d="M0 -11 L10 -7 V1 Q10 8 0 12 Q-10 8 -10 1 V-7 Z" fill="#e0bb5c" stroke="#6b4a1f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0 -8 L7 -5 V1 Q7 6 0 9 Q-7 6 -7 1 V-5 Z" fill="#f2d48a"/>
      <path d="M0 6 V-1" stroke="#3f6b2f" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M0 0 Q-6 -1 -6 -6 Q-1 -5 0 0 Z" fill="#5f9e45"/>
      <path d="M0 -2 Q6 -3 6 -8 Q1 -7 0 -2 Z" fill="#7cc05a"/>
    </symbol>
  </defs>

  <!-- ===== ACCESSORY (back): cape ===== -->
  <g data-slot="accessory" data-layer="back">
    <path class="ln" fill="#243a6b" d="M146 236 C128 300 114 410 108 500 L156 488 L204 506 L250 488 L294 500 C286 410 272 300 254 236 Z"/>
    <path class="no" fill="#172a52" d="M154 300 C148 380 140 440 134 494 L156 488 C160 430 164 370 168 300 Z"/>
    <path class="no" fill="#172a52" d="M246 300 C254 380 262 440 268 494 L250 488 C244 430 240 370 234 300 Z"/>
    <path d="M108 500 L156 488 L204 506 L250 488 L294 500" fill="none" stroke="#d8b35a" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- ===== HAIR (back): long practical ponytail ===== -->
  <g data-slot="hair" data-layer="back">
    <path class="ln" fill="#4f3024" d="M230 84 Q288 80 304 150 Q316 232 286 330 Q278 358 262 376 Q272 330 270 280 Q266 200 244 132 Q238 108 224 98 Z"/>
    <path class="no" fill="#36201a" d="M252 130 Q272 200 274 280 Q276 322 270 352 Q286 300 288 240 Q288 170 266 122 Z"/>
    <path class="thin" d="M262 150 Q282 220 280 300"/>
    <path class="no" fill="#6e4636" d="M250 96 Q282 104 292 150 Q276 116 252 108 Z"/>
  </g>

