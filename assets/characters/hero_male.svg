<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820">
  <!--
    HeroFarm — Male Hero (original design)
    Layer order back → front. Each replaceable slot is a <g data-slot="...">:
      accessory (back)  → cape
      hair (back)       → (empty for short hair)
      base              → skin / face (not replaceable)
      costume           → shirt + trousers
      boots
      armor             → leather chest, shoulder pad, belt, pouches, hip guards
      weapon            → iron sword
      gloves
      accessory (front) → cape over shoulder + HeroFarm emblem clasp
      hair (front)
      head              → head equipment (empty — for future helmets / hats)
  -->
  <defs>
    <style>
      .ln { stroke: #3a2826; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #3a2826; stroke-width: 2; stroke-linecap: round; fill: none; }
      .no { stroke: none; }
    </style>
    <!-- HeroFarm emblem: golden shield with a two-leaf sprout -->
    <symbol id="hf-emblem-m" viewBox="-12 -12 24 24">
      <path d="M0 -11 L10 -7 V1 Q10 8 0 12 Q-10 8 -10 1 V-7 Z" fill="#e0bb5c" stroke="#6b4a1f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0 -8 L7 -5 V1 Q7 6 0 9 Q-7 6 -7 1 V-5 Z" fill="#f2d48a"/>
      <path d="M0 6 V-1" stroke="#3f6b2f" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M0 0 Q-6 -1 -6 -6 Q-1 -5 0 0 Z" fill="#5f9e45"/>
      <path d="M0 -2 Q6 -3 6 -8 Q1 -7 0 -2 Z" fill="#7cc05a"/>
    </symbol>
  </defs>

  <!-- ===== ACCESSORY (back): cape ===== -->
  <g data-slot="accessory" data-layer="back">
    <path class="ln" fill="#243a6b" d="M140 238 C120 300 104 420 96 520 L150 505 L205 525 L255 505 L306 520 C296 420 282 300 262 238 Z"/>
    <path class="no" fill="#172a52" d="M150 300 C142 380 132 450 126 512 L150 505 C155 440 160 370 166 300 Z"/>
    <path class="no" fill="#172a52" d="M250 300 C258 380 268 450 276 512 L255 505 C248 440 244 370 236 300 Z"/>
    <path d="M96 520 L150 505 L205 525 L255 505 L306 520" fill="none" stroke="#d8b35a" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- ===== HAIR (back) ===== -->
  <g data-slot="hair" data-layer="back"></g>

  <!-- ===== BASE: neck, head, ears, face ===== -->
  <g data-slot="base">
    <path class="ln" fill="#f6d7bf" d="M186 200 L186 242 Q200 250 214 242 L214 200 Z"/>
    <path class="no" fill="#e8b99c" d="M187 212 Q200 228 213 212 L213 226 Q200 238 187 226 Z"/>
    <path class="ln" fill="#f6d7bf" d="M148 150 Q134 146 137 163 Q140 180 155 177 Z"/>
    <path class="ln" fill="#f6d7bf" d="M252 150 Q266 146 263 163 Q260 180 245 177 Z"/>
    <path class="ln" fill="#f6d7bf" d="M146 140 Q146 80 200 78 Q254 80 254 140 Q254 180 232 200 Q214 216 200 218 Q186 216 168 200 Q146 180 146 140 Z"/>
    <path class="no" fill="#edc4a8" d="M232 200 Q246 186 252 160 Q252 184 236 202 Q220 216 204 217 Q222 212 232 200 Z"/>
    <!-- eyes (warm golden brown) -->
    <path class="no" fill="#ffffff" d="M161 147 Q176 138 191 145 L189 166 Q176 172 163 166 Z"/>
    <ellipse cx="177" cy="156" rx="9" ry="12" fill="#b8862f"/>
    <ellipse cx="177" cy="159" rx="4.5" ry="6.5" fill="#4a2c16"/>
    <circle cx="173" cy="151" r="3" fill="#ffffff"/>
    <path d="M159 147 Q176 135 194 144" fill="none" stroke="#2e1c16" stroke-width="4" stroke-linecap="round"/>
    <path class="thin" d="M167 168 Q177 171 186 168"/>
    <path class="no" fill="#ffffff" d="M239 147 Q224 138 209 145 L211 166 Q224 172 237 166 Z"/>
    <ellipse cx="223" cy="156" rx="9" ry="12" fill="#b8862f"/>
    <ellipse cx="223" cy="159" rx="4.5" ry="6.5" fill="#4a2c16"/>
    <circle cx="219" cy="151" r="3" fill="#ffffff"/>
    <path d="M241 147 Q224 135 206 144" fill="none" stroke="#2e1c16" stroke-width="4" stroke-linecap="round"/>
    <path class="thin" d="M233 168 Q223 171 214 168"/>
    <!-- brows, nose, mouth, blush -->
    <path d="M161 130 Q174 119 190 121" fill="none" stroke="#33201a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M239 130 Q226 119 210 121" fill="none" stroke="#33201a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M200 170 L197 179 L202 180" fill="none" stroke="#c98f72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M187 191 Q200 199 213 191" fill="none" stroke="#7a3d35" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="165" cy="179" rx="9" ry="4" fill="#f2a9a0" opacity="0.45"/>
    <ellipse cx="235" cy="179" rx="9" ry="4" fill="#f2a9a0" opacity="0.45"/>
    <!-- bare hand (other arm) + feet (visible when gloves / boots are unequipped) -->
    <!-- the sword-arm hand lives in the weapon-arm group below -->
    <path class="ln" fill="#f6d7bf" d="M258 398 H286 L286 413 Q289 443 280 452 Q270 458 262 448 Q255 432 260 413 Z"/>
    <path class="ln" fill="#f6d7bf" d="M158 712 H190 Q204 740 202 758 Q200 768 186 768 H162 Q148 768 148 756 Q148 736 158 712 Z"/>
    <path class="ln" fill="#f6d7bf" d="M242 712 H210 Q196 740 198 758 Q200 768 214 768 H238 Q252 768 252 756 Q252 736 242 712 Z"/>
  </g>

  <!-- ===== COSTUME: trousers, shirt, sleeves ===== -->
  <g data-slot="costume">
    <path class="ln" fill="#3a3446" d="M154 398 H246 L256 440 L252 560 L246 720 H208 L204 470 H196 L192 720 H154 L148 560 L144 440 Z"/>
    <path class="no" fill="#2a2533" d="M204 472 L208 718 H218 L215 478 Z"/>
    <path class="no" fill="#2a2533" d="M146 442 L150 560 L156 718 H165 L159 560 L157 442 Z"/>
    <path class="thin" d="M162 560 Q172 566 182 560"/>
    <path class="thin" d="M218 560 Q228 566 238 560"/>
    <path class="ln" fill="#f3e9d2" d="M150 240 Q200 228 250 240 L262 300 L254 400 H146 L138 300 Z"/>
    <path class="ln" fill="#e3d3b2" d="M176 236 L200 262 L224 236 L214 234 L200 250 L186 234 Z"/>
    <path class="ln" fill="#f3e9d2" d="M254 248 Q274 256 280 290 L290 345 L288 400 H258 L254 345 L240 290 Z"/>
    <path class="no" fill="#dccbaa" d="M279 292 L289 345 L287 398 H278 L278 345 L268 294 Z"/>
  </g>

  <!-- ===== BOOTS ===== -->
  <g data-slot="boots">
    <path class="ln" fill="#3b2a22" d="M252 760 H200 Q198 773 212 773 H240 Q254 773 252 760 Z"/>
    <path class="ln" fill="#7a4e2e" d="M250 604 H202 L206 690 Q208 712 208 724 Q198 732 198 750 Q198 766 212 766 H240 Q254 766 254 750 Q254 732 244 724 Q244 712 246 690 Z"/>
    <path class="no" fill="#5c3920" d="M216 632 H203 L206 690 Q208 710 208 724 Q201 729 199 738 H214 Z"/>
    <path class="ln" fill="#8f5f38" d="M254 602 H198 Q196 616 200 630 H252 Q256 616 254 602 Z"/>
    <path class="thin" d="M206 690 H245"/>
    <rect class="ln" x="220" y="684" width="12" height="12" rx="2" fill="#d8b35a"/>

    <path class="ln" fill="#3b2a22" d="M148 760 H200 Q202 773 188 773 H160 Q146 773 148 760 Z"/>
    <path class="ln" fill="#7a4e2e" d="M150 604 H198 L194 690 Q192 712 192 724 Q202 732 202 750 Q202 766 188 766 H160 Q146 766 146 750 Q146 732 156 724 Q156 712 154 690 Z"/>
    <path class="no" fill="#5c3920" d="M184 632 H197 L194 690 Q192 710 192 724 Q199 729 201 738 H186 Z"/>
    <path class="ln" fill="#8f5f38" d="M146 602 H202 Q204 616 200 630 H148 Q144 616 146 602 Z"/>
    <path class="thin" d="M155 690 H194"/>
    <rect class="ln" x="168" y="684" width="12" height="12" rx="2" fill="#d8b35a"/>
  </g>

  <!-- ===== ARMOR: chest, shoulder pad, belt, pouches, hip guards ===== -->
  <g data-slot="armor">
    <path class="ln" fill="#8a5a36" d="M146 262 Q170 250 188 258 L200 300 L212 258 Q230 250 254 262 L256 330 L248 398 H152 L144 330 Z"/>
    <path class="no" fill="#6b4226" d="M228 258 Q242 255 253 263 L255 330 L247 396 H226 L234 330 Z"/>
    <path d="M200 306 V390" fill="none" stroke="#b07c4f" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M152 330 Q200 342 248 330" fill="none" stroke="#6b4226" stroke-width="2.5"/>
    <!-- shoulder pad is part of the weapon-arm group -->
    <!-- hip guards -->
    <path class="ln" fill="#8a5a36" d="M150 408 L146 454 L176 460 L182 408 Z"/>
    <path class="ln" fill="#8a5a36" d="M250 408 L254 454 L224 460 L218 408 Z"/>
    <path class="no" fill="#6b4226" d="M230 410 L249 410 L252 452 L234 456 Z"/>
    <!-- belt + emblem buckle -->
    <path class="ln" fill="#5a3a24" d="M146 386 H254 V410 H146 Z"/>
    <use href="#hf-emblem-m" x="188" y="386" width="24" height="24"/>
    <!-- pouches -->
    <rect class="ln" x="154" y="402" width="26" height="30" rx="5" fill="#7a5233"/>
    <path class="ln" fill="#936540" d="M154 408 Q167 418 180 408 V404 Q180 400 175 400 H159 Q154 400 154 404 Z"/>
    <rect class="ln" x="224" y="404" width="22" height="26" rx="5" fill="#7a5233"/>
    <path class="ln" fill="#936540" d="M224 410 Q235 418 246 410 V406 Q246 402 242 402 H228 Q224 402 224 406 Z"/>
  </g>

  <!-- ===== WEAPON ARM: sleeve + hand + sword + glove + shoulder pad, moves as one piece when attacking =====
       data-part="weapon-arm" · data-shoulder = rotation center · data-tip = sword tip at rest (for the swing trail)
       Inner groups keep their data-slot so unequipping weapon / armor still works. -->
  <g data-part="weapon-arm" data-shoulder="140 262" data-tip="94 708">
    <g data-slot="base">
      <path class="ln" fill="#f6d7bf" d="M116 398 H144 L144 413 Q149 434 142 450 Q128 460 114 450 Q108 432 115 413 Z"/>
    </g>
    <g data-slot="costume">
      <path class="ln" fill="#f3e9d2" d="M146 248 Q126 256 120 290 L112 340 L116 400 H146 L148 345 L160 290 Z"/>
      <path class="no" fill="#dccbaa" d="M121 292 L113 340 L117 398 H126 L124 345 L133 294 Z"/>
    </g>
    <!-- one-handed iron sword · data-pivot = grip point in the hand -->
    <g data-slot="weapon" data-pivot="128 437">
      <path class="ln" fill="#c9d2dc" d="M114 474 L137 478 L105 692 L96 710 L92 690 Z"/>
      <path class="no" fill="#eef3f7" d="M127 476 L136 478 L104 692 L100 700 Z"/>
      <path d="M124 482 L100 680" fill="none" stroke="#9aa6b3" stroke-width="2" stroke-linecap="round"/>
      <path class="ln" fill="#4a3325" d="M126 404 L137 406 L131 470 L120 468 Z"/>
      <path class="ln" fill="#8a8f98" d="M100 456 L152 465 L150 476 L98 467 Z"/>
      <circle class="ln" cx="132" cy="400" r="7" fill="#d8b35a"/>
    </g>
    <g data-slot="gloves">
      <path class="ln" fill="#6e4a2e" d="M114 380 H146 L144 416 H116 Z"/>
      <path class="no" fill="#533622" d="M116 382 H124 L124 414 H117 Z"/>
      <path class="ln" fill="#6e4a2e" d="M115 413 Q108 432 114 450 Q128 460 142 450 Q149 434 144 413 Z"/>
      <path class="thin" d="M116 426 H145"/>
      <path class="thin" d="M114 438 H146"/>
      <path class="ln" fill="#7d553a" d="M138 416 Q151 421 148 435 Q142 440 135 432 Z"/>
    </g>
    <g data-slot="armor">
      <path class="ln" fill="#8a5a36" d="M174 240 Q146 228 126 248 L128 276 Q150 280 170 272 Z"/>
      <path class="no" fill="#6b4226" d="M146 238 Q134 241 127 250 L129 275 Q138 277 146 276 Z"/>
      <circle cx="160" cy="254" r="2.8" fill="#d8b35a"/>
      <circle cx="140" cy="252" r="2.8" fill="#d8b35a"/>
    </g>
  </g>

  <!-- ===== GLOVES ===== -->
  <g data-slot="gloves">
    <!-- sword-hand glove is part of the weapon-arm group -->
    <!-- relaxed hand -->
    <path class="ln" fill="#6e4a2e" d="M256 380 H288 L286 416 H258 Z"/>
    <path class="no" fill="#533622" d="M278 382 H286 L285 414 H278 Z"/>
    <path class="ln" fill="#6e4a2e" d="M260 413 Q255 432 262 448 Q270 458 280 452 Q289 443 286 413 Z"/>
    <path class="ln" fill="#7d553a" d="M263 417 Q252 424 254 436 Q258 442 265 437 Z"/>
    <path class="thin" d="M268 446 Q274 449 280 445"/>
  </g>

  <!-- ===== ACCESSORY (front): cape over shoulder + emblem clasp ===== -->
  <g data-slot="accessory" data-layer="front">
    <path class="ln" fill="#243a6b" d="M212 238 Q248 228 268 246 L286 302 Q262 292 246 297 L230 262 Z"/>
    <path class="no" fill="#172a52" d="M266 248 L284 300 Q274 296 266 296 L254 256 Z"/>
    <path d="M286 302 Q262 292 246 297" fill="none" stroke="#d8b35a" stroke-width="3" stroke-linecap="round"/>
    <use href="#hf-emblem-m" x="200" y="236" width="26" height="26"/>
  </g>

  <!-- ===== HAIR (front): short dark brown ===== -->
  <g data-slot="hair" data-layer="front">
    <path class="ln" fill="#4a2f22" d="M136 150 Q128 68 200 58 Q274 68 264 150 Q258 120 240 108 Q200 96 160 108 Q142 120 136 150 Z"/>
    <path class="ln" fill="#4a2f22" d="M194 62 Q202 36 222 40 Q210 50 214 64 Z"/>
    <path class="ln" fill="#4a2f22" d="M148 122 Q154 80 200 74 Q248 80 254 126 L241 116 L237 138 L223 112 L212 134 L202 108 L190 134 L179 112 L167 136 L159 116 Z"/>
    <path class="ln" fill="#4a2f22" d="M146 122 Q138 150 146 180 L156 148 Z"/>
    <path class="ln" fill="#4a2f22" d="M254 122 Q262 150 254 180 L244 148 Z"/>
    <path class="no" fill="#33201a" d="M232 84 Q252 96 254 124 L241 116 Q240 98 226 86 Z"/>
    <path class="no" fill="#6b4632" d="M168 84 Q196 72 224 82 Q200 82 176 94 Z"/>
  </g>

  <!-- ===== HEAD EQUIPMENT (empty slot for future helmets / hats) ===== -->
  <g data-slot="head"></g>
</svg>
